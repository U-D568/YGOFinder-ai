data:
  train_csv: training/datasets/train.csv
  valid_csv: training/datasets/valid.csv
  card_image_dir: training/datasets/card_images_small

model:
  input_shape: [224, 224, 3]

training:
  epochs: 100
  batch_size: 16
  validation_batch_size: 8
  hard_select_start_epoch: 0
  matrix_refresh_interval: 3
  augmentation:
    min_ratio: 0.1
    max_ratio: 0.4
  optimizer:
    name: AdamW
    learning_rate: 0.0001
    weight_decay: 0.0001
  scheduler:
    type: cosine
    warmup_epochs: 3
    total_epochs: 100
    decay_rate: 0.96
    staircase: true
  contrastive_loss:
    margin: 0.2

checkpoint:
  directory: training/embedding/weights
  resume_from: best.h5
  save_best_as: best.h5
  save_last_as: last.h5
